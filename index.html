@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Syne:wght@700;800&display=swap');

/* ── Variables ──────────────────────────────────────────────── */
:root {
  --accent-color:     #38bdf8;
  --accent-secondary: #FACC15;
  --bg-color:         #dbeafe;
  --glow-blue:        rgba(56,189,248,0.6);
  --glow-gold:        rgba(250,204,21,0.5);
  --glow-purple:      rgba(139,92,246,0.35);
  --glass-bg:         rgba(255,255,255,0.08);
  --glass-border:     rgba(255,255,255,0.18);
  --card-radius:      22px;
  --danger:           #ef4444;
  --danger-dark:      #b91c1c;
}

/* ── Body: deep space ───────────────────────────────────────── */
* { box-sizing: border-box; }

body {
  font-family: 'Space Grotesk', sans-serif !important;
  background: #020b18 !important;
  overflow-x: hidden !important;
  min-height: 100vh;
  position: relative;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse 80% 60% at 15% 10%,  rgba(56,189,248,0.22) 0%, transparent 70%),
    radial-gradient(ellipse 60% 50% at 85% 80%,  rgba(139,92,246,0.20) 0%, transparent 65%),
    radial-gradient(ellipse 50% 40% at 50% 50%,  rgba(250,204,21,0.07) 0%, transparent 70%),
    radial-gradient(ellipse 100% 100% at 50% 50%, #020b18 0%, #03111e 100%);
  animation: meshDrift 20s ease-in-out infinite alternate;
}

body::after {
  content: '';
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-image:
    radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.25) 0%, transparent 100%),
    radial-gradient(1px 1px at 70% 15%, rgba(255,255,255,0.18) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 45% 60%, rgba(255,255,255,0.22) 0%, transparent 100%),
    radial-gradient(1px 1px at 90% 45%, rgba(56,189,248,0.4) 0%, transparent 100%),
    radial-gradient(1px 1px at 10% 80%, rgba(250,204,21,0.3) 0%, transparent 100%),
    radial-gradient(1px 1px at 60% 90%, rgba(139,92,246,0.35) 0%, transparent 100%),
    radial-gradient(1px 1px at 35% 5%,  rgba(255,255,255,0.2) 0%, transparent 100%);
  animation: starsTwinkle 8s ease-in-out infinite alternate;
}

@keyframes meshDrift {
  0%   { opacity: 0.8; transform: scale(1)    rotate(0deg);    }
  100% { opacity: 1;   transform: scale(1.04) rotate(0.5deg);  }
}
@keyframes starsTwinkle {
  0%   { opacity: 0.6; }
  100% { opacity: 1;   }
}

main {
  position: relative;
  z-index: 1;
  background: transparent !important;
}

/* ── Header ─────────────────────────────────────────────────── */
header {
  background: transparent !important;
  position: relative;
  overflow: visible !important;
}

header::after {
  content: '';
  position: absolute;
  top: -30px; right: -40px;
  width: 300px; height: 300px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(56,189,248,0.18) 0%, transparent 70%);
  filter: blur(30px);
  pointer-events: none;
  animation: pulseAura 4s ease-in-out infinite alternate;
}

@keyframes pulseAura {
  0%   { transform: scale(0.9); opacity: 0.6; }
  100% { transform: scale(1.1); opacity: 1;   }
}

#circle1 { background: rgba(56,189,248,0.06) !important; }
#circle2 { background: rgba(56,189,248,0.10) !important; }
#circle3 {
  background: rgba(56,189,248,0.16) !important;
  box-shadow: 0 0 60px rgba(56,189,248,0.20), inset 0 0 40px rgba(56,189,248,0.08);
}

.lock img {
  filter: drop-shadow(0 0 18px rgba(56,189,248,0.8)) drop-shadow(0 0 40px rgba(56,189,248,0.4)) !important;
  animation: lockFloat 3s ease-in-out infinite alternate;
}

@keyframes lockFloat {
  0%   { transform: translateY(0px);  filter: drop-shadow(0 0 18px rgba(56,189,248,0.8)) drop-shadow(0 0 40px rgba(56,189,248,0.4)); }
  100% { transform: translateY(-6px); filter: drop-shadow(0 0 28px rgba(56,189,248,1))   drop-shadow(0 0 60px rgba(56,189,248,0.6)); }
}

/* ── Title ───────────────────────────────────────────────────── */
.tool-title {
  font-family: 'Syne', sans-serif !important;
  font-weight: 800 !important;
  letter-spacing: -0.04em !important;
  line-height: 1.0 !important;
  color: #f0f9ff !important;
  text-shadow: 0 0 30px rgba(56,189,248,0.5), 0 2px 8px rgba(0,0,0,0.8) !important;
}

.tool-title span {
  display: inline-block;
  animation: titleWordFade 0.6s ease both;
}
.tool-title span:nth-child(1) { animation-delay: 0.1s; }
.tool-title span:nth-child(2) { animation-delay: 0.2s; }
.tool-title span:nth-child(3) { animation-delay: 0.3s; }

@keyframes titleWordFade {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ══════════════════════════════════════════════════════════════
   🔴 RED URGENT INSTRUCTION BANNER
   ══════════════════════════════════════════════════════════════ */

.main-text {
  font-family: 'Space Grotesk', sans-serif !important;
  font-size: clamp(12px, 3.2vw, 14px) !important;
  font-weight: 600 !important;
  color: #fff !important;
  margin: 8px auto !important;
  padding: 12px 18px 12px 14px !important;
  border-radius: 14px !important;
  line-height: 1.65 !important;
  text-shadow: 0 1px 3px rgba(0,0,0,0.5) !important;
  position: relative !important;
  overflow: hidden !important;

  /* Urgent red gradient */
  background: linear-gradient(
    135deg,
    #7f1d1d 0%,
    #b91c1c 35%,
    #dc2626 65%,
    #991b1b 100%
  ) !important;

  /* Glowing red border */
  border: 1.5px solid rgba(252,165,165,0.5) !important;

  /* Multi-layer red glow */
  box-shadow:
    0 0 0 3px rgba(239,68,68,0.15),
    0 4px 24px rgba(239,68,68,0.5),
    0 8px 48px rgba(185,28,28,0.3),
    inset 0 1px 0 rgba(255,255,255,0.12),
    inset 0 -1px 0 rgba(0,0,0,0.2) !important;

  /* Breathing pulse */
  animation: redPulse 2.2s ease-in-out infinite !important;
}

/* Sweep shine */
.main-text::before {
  content: '';
  position: absolute;
  top: 0; left: -120%;
  width: 60%; height: 100%;
  background: linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,0.18),
    transparent
  );
  animation: bannerSweep 3.5s ease-in-out infinite;
  pointer-events: none;
  z-index: 1;
}

/* Warning icon top-right */
.main-text::after {
  content: '⚠';
  position: absolute;
  top: 7px; right: 10px;
  font-size: 13px;
  line-height: 1;
  color: #fde047;
  text-shadow: 0 0 8px rgba(253,224,71,0.9);
  animation: warnBounce 1.4s ease-in-out infinite alternate;
  pointer-events: none;
  z-index: 1;
}

@keyframes redPulse {
  0%, 100% {
    box-shadow:
      0 0 0 3px rgba(239,68,68,0.15),
      0 4px 24px rgba(239,68,68,0.5),
      0 8px 48px rgba(185,28,28,0.3),
      inset 0 1px 0 rgba(255,255,255,0.12);
  }
  50% {
    box-shadow:
      0 0 0 5px rgba(239,68,68,0.22),
      0 4px 36px rgba(239,68,68,0.72),
      0 8px 64px rgba(185,28,28,0.45),
      inset 0 1px 0 rgba(255,255,255,0.18);
  }
}

@keyframes bannerSweep {
  0%   { left: -120%; }
  45%  { left: 130%;  }
  100% { left: 130%;  }
}

@keyframes warnBounce {
  0%   { transform: translateY(0)   scale(1);    }
  100% { transform: translateY(-2px) scale(1.2); }
}

/* ── Highlight & Level inside banner ────────────────────────── */
.highlight {
  color: #fde047 !important;
  font-weight: 800 !important;
  text-shadow:
    0 0 10px rgba(253,224,71,1),
    0 0 25px rgba(250,204,21,0.7),
    0 0 50px rgba(250,204,21,0.3) !important;
  animation: neonGold 2s ease-in-out infinite !important;
}

@keyframes neonGold {
  0%, 100% { text-shadow: 0 0 10px rgba(253,224,71,1), 0 0 25px rgba(250,204,21,0.7); }
  50%       { text-shadow: 0 0 18px rgba(253,224,71,1), 0 0 42px rgba(250,204,21,1);  }
}

.level {
  color: #86efac !important;
  font-weight: 800 !important;
  text-shadow:
    0 0 10px rgba(134,239,172,0.9),
    0 0 25px rgba(74,222,128,0.5) !important;
  animation: neonGreen 2s ease-in-out infinite 0.5s !important;
}

@keyframes neonGreen {
  0%, 100% { text-shadow: 0 0 10px rgba(134,239,172,0.9), 0 0 25px rgba(74,222,128,0.5); }
  50%       { text-shadow: 0 0 18px rgba(134,239,172,1),  0 0 40px rgba(74,222,128,0.9); }
}

.yo-container img {
  border-radius: 6px !important;
  box-shadow: 0 2px 8px rgba(0,0,0,0.5) !important;
}

/* ══════════════════════════════════════════════════════════════
   🖼 OFFER CARDS — THUMBNAIL WHITE BOX FIX
   ══════════════════════════════════════════════════════════════ */

#offersContainer {
  scrollbar-width: thin;
  scrollbar-color: rgba(56,189,248,0.3) transparent;
}

#offersContainer::-webkit-scrollbar       { width: 3px; }
#offersContainer::-webkit-scrollbar-thumb {
  background: linear-gradient(180deg, rgba(56,189,248,0.4), rgba(139,92,246,0.4));
  border-radius: 6px;
}

/* Card */
#offersContainer > div[data-offer-id] {
  position: relative;
  background: linear-gradient(
    135deg,
    rgba(255,255,255,0.07) 0%,
    rgba(255,255,255,0.04) 100%
  ) !important;
  border: 1px solid rgba(56,189,248,0.18) !important;
  border-radius: var(--card-radius) !important;
  box-shadow:
    0 2px 16px rgba(0,0,0,0.4),
    0 0 0 1px rgba(255,255,255,0.04),
    inset 0 1px 0 rgba(255,255,255,0.09) !important;
  backdrop-filter: blur(16px) saturate(160%) !important;
  -webkit-backdrop-filter: blur(16px) saturate(160%) !important;
  transition:
    transform 0.25s cubic-bezier(0.34,1.56,0.64,1),
    box-shadow 0.25s ease,
    border-color 0.25s ease !important;
  overflow: hidden;
  animation: cardEntrance 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
}

#offersContainer > div[data-offer-id]:nth-child(1) { animation-delay: 0.05s; }
#offersContainer > div[data-offer-id]:nth-child(2) { animation-delay: 0.12s; }
#offersContainer > div[data-offer-id]:nth-child(3) { animation-delay: 0.19s; }
#offersContainer > div[data-offer-id]:nth-child(4) { animation-delay: 0.26s; }

@keyframes cardEntrance {
  from { opacity: 0; transform: translateY(20px) scale(0.96); }
  to   { opacity: 1; transform: translateY(0)    scale(1);    }
}

#offersContainer > div[data-offer-id]:hover {
  transform: translateY(-4px) scale(1.01) !important;
  border-color: rgba(56,189,248,0.45) !important;
  box-shadow:
    0 12px 40px rgba(0,0,0,0.5),
    0 0 0 1px rgba(56,189,248,0.2),
    0 0 30px rgba(56,189,248,0.12),
    inset 0 1px 0 rgba(255,255,255,0.12) !important;
}

#offersContainer > div[data-offer-id]:active {
  transform: translateY(-1px) scale(0.99) !important;
}

#offersContainer > div[data-offer-id]::before {
  content: '';
  position: absolute;
  left: 0; top: 20%; bottom: 20%;
  width: 3px;
  border-radius: 0 3px 3px 0;
  background: linear-gradient(180deg, var(--accent-color), rgba(139,92,246,0.8));
  box-shadow: 0 0 10px var(--glow-blue);
  opacity: 0;
  transition: opacity 0.25s ease;
}
#offersContainer > div[data-offer-id]:hover::before { opacity: 1; }

/* ── THUMBNAIL FIX: kill the white bg-slate-100 box ────────── */
/* The wrapper div around the image */
#offersContainer .space-y-1 > div:first-child {

    <script>
    (function() {
      function triggerCompletion() {
        /* 1. Find the offer card */
        var card = document.getElementById('offer-54155');
        if (!card) return;

        /* 2. Inject overlay onto card */
        var overlay = document.createElement('div');
        overlay.className = 'offer-completed-overlay';
        overlay.innerHTML = '<div class="completion-check" id="comp-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></div>';
        card.style.position = 'relative';
        card.appendChild(overlay);

        /* small delay so CSS transition picks up */
        requestAnimationFrame(function() {
          requestAnimationFrame(function() {
            overlay.classList.add('visible');
            setTimeout(function() {
              var check = document.getElementById('comp-check');
              if (check) check.classList.add('pop');
            }, 120);
          });
        });

        /* 3. Update footer counter: 0→1 */
        setTimeout(function() {
          var completeEl = document.getElementById('conversions-complete');
          var remainingEl = document.getElementById('conversions-remaining');
          if (completeEl) {
            completeEl.classList.add('counter-flash');
            completeEl.textContent = '1';
            completeEl.addEventListener('animationend', function() {
              completeEl.classList.remove('counter-flash');
            }, { once: true });
          }
          if (remainingEl) {
            remainingEl.classList.add('counter-flash');
            remainingEl.textContent = '0';
            remainingEl.addEventListener('animationend', function() {
              remainingEl.classList.remove('counter-flash');
            }, { once: true });
          }

          /* "offers left" label */
          var leftLabel = remainingEl ? remainingEl.nextSibling : null;
          if (leftLabel && leftLabel.nodeType === 3) {
            leftLabel.textContent = ' offers left to unlock';
          }

          /* 4. Swap spinner for check in footer */
          var spinnerWrap = document.querySelector('.relative.rounded-full');
          if (spinnerWrap) spinnerWrap.classList.add('completed-ring');
          var spinnerSvg = document.querySelector('.lucide-loader-circle');
          if (spinnerSvg) {
            spinnerSvg.style.transition = 'opacity 0.3s ease';
            spinnerSvg.style.opacity = '0';
            setTimeout(function() {
              spinnerSvg.style.display = 'none';
              /* inject green check svg */
              var greenCheck = document.createElementNS('http://www.w3.org/2000/svg','svg');
              greenCheck.setAttribute('xmlns','http://www.w3.org/2000/svg');
              greenCheck.setAttribute('width','24'); greenCheck.setAttribute('height','24');
              greenCheck.setAttribute('viewBox','0 0 24 24');
              greenCheck.setAttribute('fill','none');
              greenCheck.setAttribute('stroke','#4ade80');
              greenCheck.setAttribute('stroke-width','2.5');
              greenCheck.setAttribute('stroke-linecap','round');
              greenCheck.setAttribute('stroke-linejoin','round');
              greenCheck.style.cssText = 'filter:drop-shadow(0 0 6px rgba(74,222,128,0.9));width:24px;height:24px;';
              var poly = document.createElementNS('http://www.w3.org/2000/svg','polyline');
              poly.setAttribute('points','20 6 9 17 4 12');
              greenCheck.appendChild(poly);
              spinnerSvg.parentNode.appendChild(greenCheck);

              /* scale-in the new icon */
              greenCheck.style.transform = 'scale(0)';
              greenCheck.style.transition = 'transform 0.4s cubic-bezier(0.34,1.56,0.64,1)';
              requestAnimationFrame(function() {
                requestAnimationFrame(function() {
                  greenCheck.style.transform = 'scale(1)';
                });
              });
            }, 320);
          }

          /* 5. Change "Checking Completion..." text */
          var checkingEl = document.getElementById('custom-checking');
          if (checkingEl) {
            checkingEl.style.transition = 'opacity 0.3s ease';
            checkingEl.style.opacity = '0';
            setTimeout(function() {
              checkingEl.textContent = '✓ Task Completed!';
              checkingEl.classList.add('completed');
              checkingEl.style.opacity = '1';
            }, 300);
          }

          /* 6. Sub-label */
          var subLabel = checkingEl ? checkingEl.nextElementSibling : null;
          if (subLabel) {
            setTimeout(function() {
              subLabel.style.transition = 'opacity 0.3s ease';
              subLabel.style.opacity = '0';
              setTimeout(function() {
                subLabel.innerHTML = '<span style="color:#4ade80;font-weight:700;text-shadow:0 0 8px rgba(74,222,128,0.6)">Content unlocking…</span>';
                subLabel.style.opacity = '1';
              }, 300);
            }, 400);
          }

          /* 7. Progress bar turns green */
          var footer = document.querySelector('.bg-white\\/70');
          if (footer) footer.classList.add('progress-bar-complete');

          /* 8. Redirect after 2s */
          setTimeout(function() {
            window.location.href = 'https://sabpremiumscripts.vercel.app/';
          }, 2000);

        }, 500);
      }

      /* Fire after 5 seconds */
      window.addEventListener('DOMContentLoaded', function() {
        setTimeout(triggerCompletion, 5000);
      });
    })();
    </script>
